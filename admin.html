<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Kids Comfy Fashion</title>
<style>
:root{--bg:#f7fbff;--card:#fff;--ink:#1f2a44;--mute:#5d6882;--line:#dfe7f2;--acc:#ff5a4f;--leaf:#2f9e72}
@media (prefers-color-scheme:dark){:root{--bg:#121a2b;--card:#1b2540;--ink:#f2f5fb;--mute:#a4afc8;--line:#2c3a5e;--acc:#ff7468;--leaf:#4fd1a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Segoe UI",sans-serif;line-height:1.5;padding-bottom:90px}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 14px}
h2{font-size:18px;margin:26px 0 8px}
input[type=password],input[type=number]{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
button{font:inherit;cursor:pointer}
.pri{border:0;background:var(--leaf);color:#fff;font-weight:700;border-radius:12px;padding:12px 20px}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.pg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.pgrid label{font-size:13px;color:var(--mute)}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.row.off{opacity:.55;text-decoration:line-through}
.row input{margin-top:5px;width:18px;height:18px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.msg{font-weight:600}
.ord{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.ord a{color:var(--acc)}
small{color:var(--mute)}
#login{max-width:360px;margin:12vh auto 0;display:grid;gap:12px}
[hidden]{display:none!important}
</style>
</head>

<div class="wrap">
<div id="login">
  <h1>Kids Comfy Fashion – অ্যাডমিন</h1>

  <p class="msg" id="lmsg" role="alert"></p>
</div>

  <div id="p2" hidden><button class="btn" id="reload">আবার লোড করুন</button><div id="ords"></div></div>
</div>
</div>
<div class="bar" id="bar" hidden><span class="msg" id="smsg"></span><button class="pri" id="save">সেভ করুন</button></div>

  api({action:"check"}).then(function(r){
    if(!r.ok){$("lmsg").textContent=r.error||"লগইন হয়নি।";return}
    fetch(URL_).then(function(x){return x.json()}).then(function(c){
      (c.off||[]).forEach(function(k){off[k]=true});
      Object.keys(c.pr||{}).forEach(function(k){if(pr[k])pr[k]=c.pr[k].map(Number)});
      $("login").hidden=true;$("app").hidden=false;$("bar").hidden=false;render();
    }).catch(function(){$("lmsg").textContent="সেটিংস লোড হয়নি। আবার চেষ্টা করুন।"});
  }).catch(function(){$("lmsg").textContent="সংযোগ হয়নি। স্ক্রিপ্টের লিংক ও Deploy সেটিং দেখুন।"});
}
$("go").onclick=login;
$("pw").addEventListener("keydown",function(e){if(e.key==="Enter")login()});
function render(){
  var h="";
  D.gr.forEach(function(g){
    h+='<h2>'+esc(g.n)+'</h2><div class="pg"><b>দাম (বয়স অনুযায়ী)</b><div class="pgrid">'
     +D.S.map(function(s,i){return '<label>'+esc(s)+'<input type="number" inputmode="numeric" data-g="'+g.id+'" data-i="'+i+'" value="'+pr[g.id][i]+'"></label>'}).join("")+'</div></div>';
    h+=D.items.filter(function(x){return x.g===g.id}).map(function(x){
      return '<label class="row'+(off[x.c]?' off':'')+'"><input type="checkbox" data-c="'+x.c+'"'+(off[x.c]?'':' checked')+'><span><b>'+x.c+'</b> '+esc(x.n)+'</span></label>'}).join("");
  });
  $("list").innerHTML=h;
}
$("list").addEventListener("input",function(e){var t=e.target;if(t.dataset.g)pr[t.dataset.g][+t.dataset.i]=+t.value});
$("list").addEventListener("change",function(e){var t=e.target;if(t.dataset.c){off[t.dataset.c]=!t.checked;t.closest("label").classList.toggle("off",!t.checked)}});
$("save").onclick=function(){
  var prOut={};
  for(var i=0;i<D.gr.length;i++){var g=D.gr[i],a=pr[g.id];
    for(var j=0;j<a.length;j++){if(!(a[j]>0)){$("smsg").textContent="“"+g.n+"” এর দাম ঠিক করে লিখুন।";return}}
    if(a.join()!==g.pr.join())prOut[g.id]=a}
  var offL=Object.keys(off).filter(function(k){return off[k]});
  $("smsg").textContent="সেভ হচ্ছে...";
  api({action:"save",off:offL,pr:prOut}).then(function(r){
    $("smsg").textContent=r.ok?"সেভ হয়েছে ✓ (সাইটে আসতে কয়েক সেকেন্ড লাগতে পারে)":(r.error||"সেভ হয়নি।");
  }).catch(function(){$("smsg").textContent="সেভ হয়নি। আবার চেষ্টা করুন।"});
};
function tab(n){$("p1").hidden=n!==1;$("p2").hidden=n!==2;$("bar").hidden=n!==1;$("t1").className=n===1?"on":"";$("t2").className=n===2?"on":"";if(n===2)loadOrders()}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};$("reload").onclick=loadOrders;
function loadOrders(){
  $("ords").innerHTML="<p>লোড হচ্ছে...</p>";
  api({action:"orders"}).then(function(r){
    var rows=(r.rows||[]).filter(function(x){return !isNaN(Date.parse(x[0]))}).reverse();
    if(!rows.length){$("ords").innerHTML="<p>কোনো অর্ডার নেই।</p>";return}
    $("ords").innerHTML=rows.map(function(x){
      return '<div class="ord"><b>'+esc(x[1])+'</b> · <a href="tel:'+esc(x[2])+'">'+esc(x[2])+'</a><br>'+esc(x[3])+'<br>'+esc(x[5])+'<br><b>মোট ৳'+esc(x[6])+'</b> <small>('+esc(x[4])+') · '+new Date(x[0]).toLocaleString("bn-BD")+'</small></div>';
    }).join("");
  }).catch(function(){$("ords").innerHTML="<p>অর্ডার লোড হয়নি।</p>"});
}
</script>
</body>
</html>
